<!DOCTYPE html>
<html>

<head>
    <title>Student Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="header">
    <h1>Student Login</h1>
</div>

<div class="container">

    <div class="card">

        <h2>Welcome Student</h2>

        <form method="POST">

            <p>
                <label>Student ID</label><br>

                <input type="text"
                       name="student_id"
                       placeholder="Enter Student ID"
                       required>
            </p>

            <p>
                <label>Password</label><br>

                <input type="password"
                       name="password"
                       placeholder="Enter Password"
                       required>
            </p>

            <button type="submit">
                Login
            </button>

        </form>

        {% if message %}

        <p class="error">
            {{ message }}
        </p>

        {% endif %}

        <p>
            New student?

            <a href="/student-register">
                Register here
            </a>
        </p>

        <a href="/">
            <button>Back to Home</button>
        </a>

    </div>

</div>

</body>
</html>
